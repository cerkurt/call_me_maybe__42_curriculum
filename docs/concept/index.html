<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call me maybe · Evaluation walkthrough</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #141b20; color: #f4f6f6; font-family: Arial, sans-serif; }
header { min-height: 68px; padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
header strong { font-size: 18px; margin-right: auto; }
button, select { background: #253039; color: #fff; border: 1px solid #52606a; border-radius: 8px; padding: 9px 13px; font: inherit; font-size: 15px; }
button { cursor: pointer; }
button:hover { background: #345044; }
button:disabled { opacity: .4; cursor: default; }
select { max-width: min(410px, 75vw); }
main { height: calc(100vh - 130px); display: flex; justify-content: center; align-items: center; padding: 4px 20px; }
#slide { display: block; width: 100%; height: 100%; object-fit: contain; }
footer { min-height: 54px; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 15px; color: #c3cbd0; }
#notes { position: fixed; bottom: 60px; left: 24px; right: 24px; max-height: 35vh; overflow: auto; background: #172229f5; border: 1px solid #61756d; padding: 22px; border-radius: 12px; font-size: 19px; line-height: 1.55; }
#notes[hidden] { display: none; }
#notes strong { display: block; margin-bottom: 10px; }
@media (max-width: 800px) { header { gap: 8px; } header strong { width: 100%; } main { height: calc(100vh - 185px); } .hint { display: none; } }
</style>
</head>
<body>
<header>
<strong>Call me maybe</strong>
<select id="jump" aria-label="Choose a slide"></select>
<button id="previous" type="button">Previous</button>
<button id="next" type="button">Next</button>
<button id="notesButton" type="button" aria-expanded="false">Notes</button>
<button id="fullscreen" type="button">Full screen</button>
</header>
<main><img id="slide" alt="" draggable="false"></main>
<footer><span id="counter"></span><span class="hint">Left / Right: navigate · N: notes · F: full screen</span></footer>
<aside id="notes" hidden><strong id="notesTitle"></strong><div id="notesText"></div></aside>
<script>
const slides = [{"number": 1, "title": "Call me maybe", "file": "01-call-me-maybe.png", "notes": "Follow one request: Add 2 and 2.5. The intended output describes a function call. The program does not execute the requested addition. The deck uses illustrative token IDs and scores, clearly marked on the relevant slides."}, {"number": 2, "title": "The complete request flow", "file": "02-the-complete-request-flow.png", "notes": "The CLI validates both files before initializing the SDK. progress_builder loops over validated prompts, chooses a function and extracts arguments. The caller writes the completed result list only after generation finishes."}, {"number": 3, "title": "CLI options and two input files", "file": "03-cli-options-and-two-input-files.png", "notes": "Argparse supplies default paths unless explicit CLI options override them. The function definitions describe names, descriptions, parameters and return types. Prompt entries contain natural-language requests."}, {"number": 4, "title": "JSON data becomes validated models", "file": "04-json-data-becomes-validated-models.png", "notes": "json.load produces Python lists and dictionaries. The loader checks the root list and each dictionary, then constructs FunctionDefinition or PromptTest models. Definition lists additionally reject empty lists, blank names and duplicates. File/JSON/model errors propagate to the CLI."}, {"number": 5, "title": "One model, many requests", "file": "05-one-model-many-requests.png", "notes": "main creates Small_LLM_Model once per invocation and passes that object to progress_builder and its helpers. These helpers do not retrain the model. Learned model weights determine logits from the supplied context."}, {"number": 6, "title": "Text, token pieces, and token IDs", "file": "06-text-token-pieces-and-token-ids.png", "notes": "This is a toy vocabulary, not an actual SDK tokenization trace. In this deck, space is ID 10, 2 is ID 20, .0 is ID 30 and .5 is ID 40. Those same illustrative IDs are reused for the later prefix simulation. Real tokenization may merge spaces with other characters and varies by tokenizer."}, {"number": 7, "title": "The LLM returns logits", "file": "07-the-llm-returns-logits.png", "notes": "The model processes context IDs through learned weights and returns unnormalized scores. Scores change when context changes. A token ID is a vocabulary position, not its score. This table shows only three illustrative positions, not a full vocabulary."}, {"number": 8, "title": "Full-sequence function scoring", "file": "08-full-sequence-function-scoring.png", "notes": "Each candidate name is already known from definitions. The scorer encodes it, then walks its tokens. At each step it computes log-softmax for the next known candidate token, adds that score and appends that known token to the scoring context. It sums scores without length normalization. It does not mask logits or generate a new name."}, {"number": 9, "title": "Hybrid function selection", "file": "09-hybrid-function-selection.png", "notes": "The selector keeps the highest and second-highest complete-name scores. If only one candidate exists, it returns it. If best minus second is at least 2.0, it returns the leader. Otherwise it asks whether each top-two function can fulfill the request, scoring Yes minus No. The larger capability score wins, with ties favoring the original name-score leader. These are illustrative rankings."}, {"number": 10, "title": "The selected function definition", "file": "10-the-selected-function-definition.png", "notes": "After the hybrid selector returns an available name, progress_builder finds the matching FunctionDefinition. Its parameters are metadata models. The actual extracted values belong in a new, separate parameter_dict. The example assumes fn_add_numbers is the intended selection."}, {"number": 11, "title": "The argument extraction loop", "file": "11-the-argument-extraction-loop.png", "notes": "For each required field, the flow builds type-specific candidates, formats a context including extracted_parameters, selects JSON candidate text and parses it. A fresh parameter dictionary is created per prompt. The final result is appended once after the parameter loop, not once per parameter."}, {"number": 12, "title": "Number candidates", "file": "12-number-candidates.png", "notes": "The regex extracts signs, decimals, scientific notation and comma-grouped numbers. It removes grouping commas and converts matches to finite floats. Duplicate values remain allowed. Candidate extraction is different from choosing which number belongs to parameter a or b. Number words are not supported."}, {"number": 13, "title": "String candidates", "file": "13-string-candidates.png", "notes": "The quote-aware helpers keep spaces inside quoted spans. The slicer collects chunks, strips matching outer delimiters, adds two- and three-word phrases from unquoted segments, adds selected punctuation-trimmed alternatives, includes quoted contents and deduplicates in first-seen order. Arbitrary long unquoted values are not all covered."}, {"number": 14, "title": "Boolean candidates", "file": "14-boolean-candidates.png", "notes": "The Python candidates are True and False. json.dumps turns them into true and false. The extraction instruction asks the model to resolve negation and interpret the parameter name. These examples explain intended values, not a guarantee of all model outputs. Known semantic errors may remain."}, {"number": 15, "title": "The extraction prompt", "file": "15-the-extraction-prompt.png", "notes": "The helper selects instructions based on the current declared type. It displays function metadata, request, all required fields and earlier extracted values. It serializes earlier arguments, removes only the final brace, and appends the JSON-serialized key and colon. The open assistant start follows the model chat markers."}, {"number": 16, "title": "JSON candidates become ID sequences", "file": "16-json-candidates-become-id-sequences.png", "notes": "For each typed candidate, the code creates a leading space plus json.dumps(candidate, ensure_ascii=False), encodes it and stores the text-to-IDs mapping. The toy IDs are consistent with slide 6: space 10, 2 20, .0 30 and .5 40. These sequences are teaching examples, not measured SDK IDs. A changed space can change tokenization and the next-token context."}, {"number": 17, "title": "Candidate prefix · step 1 of 4", "file": "17-candidate-prefix-step-1-of-4.png", "notes": "Illustrative numeric candidates: \" 2.0\" maps to [10,20,30] and \" 2.5\" to [10,20,40]. Current generated prefix: []. Allowed next IDs: [10]. The helper takes the prefix-length slice of each candidate and, for unfinished matches, offers the ID at that same length index. A complete match returns the original candidate key before another token is selected."}, {"number": 18, "title": "Candidate prefix · step 2 of 4", "file": "18-candidate-prefix-step-2-of-4.png", "notes": "Illustrative numeric candidates: \" 2.0\" maps to [10,20,30] and \" 2.5\" to [10,20,40]. Current generated prefix: [10]. Allowed next IDs: [20]. The helper takes the prefix-length slice of each candidate and, for unfinished matches, offers the ID at that same length index. A complete match returns the original candidate key before another token is selected."}, {"number": 19, "title": "Candidate prefix · step 3 of 4", "file": "19-candidate-prefix-step-3-of-4.png", "notes": "Illustrative numeric candidates: \" 2.0\" maps to [10,20,30] and \" 2.5\" to [10,20,40]. Current generated prefix: [10,20]. Allowed next IDs: [30,40]. The helper takes the prefix-length slice of each candidate and, for unfinished matches, offers the ID at that same length index. A complete match returns the original candidate key before another token is selected."}, {"number": 20, "title": "Scores before masking", "file": "20-scores-before-masking.png", "notes": "At prefix [10,20], the two numeric candidates permit only 30 or 40. ID 99 is a toy example of another vocabulary token, here a closing brace. Raw logits are illustrative. This table shows why unrestricted argmax can break the allowed candidate set."}, {"number": 21, "title": "Scores after masking", "file": "21-scores-after-masking.png", "notes": "The implementation converts allowed IDs into a set, walks the full logit list by index and assigns negative infinity to forbidden positions. The list is not compacted because its index must still equal the token ID. The highest remaining usable logit wins. This is a partial table of illustrative logits."}, {"number": 22, "title": "Candidate prefix · step 4 of 4", "file": "22-candidate-prefix-step-4-of-4.png", "notes": "Illustrative numeric candidates: \" 2.0\" maps to [10,20,30] and \" 2.5\" to [10,20,40]. Current generated prefix: [10,20,30]. Allowed next IDs: []. The helper takes the prefix-length slice of each candidate and, for unfinished matches, offers the ID at that same length index. A complete match returns the original candidate key before another token is selected."}, {"number": 23, "title": "Two token histories", "file": "23-two-token-histories.png", "notes": "all_token_ids contains the encoded extraction prompt and each selected continuation ID. generated_token_ids begins empty and contains only continuation IDs. Both receive each selected ID. Prefix matching must exclude prompt IDs. The helper checks full matches before each step and again after the final permitted step, then raises on budget exhaustion."}, {"number": 24, "title": "The next parameter sees earlier values", "file": "24-the-next-parameter-sees-earlier-values.png", "notes": "json.loads parses the selected candidate key, including its leading whitespace. The resulting float is stored under the current parameter name. The next extraction prompt includes the earlier arguments and continues the open JSON object. The candidate pool may remain the same, while logits change with context. This is an intended worked output, not a promise of perfect model extraction."}, {"number": 25, "title": "The special regex branch", "file": "25-the-special-regex-branch.png", "notes": "The code checks for source_string, regex and replacement, all declared as string. The ordinary loop skips regex, extracts other values and then performs special handling. This is a schema-name convention, not arbitrary nested-schema support. Pattern selection remains bounded by the helper catalog."}, {"number": 26, "title": "Regex selection through option codes", "file": "26-regex-selection-through-option-codes.png", "notes": "The catalog includes vowels, letters, digit sequences, uppercase, lowercase, whitespace and punctuation. It adds quoted literals present in the source and different from the entire source, using re.escape. The model selects an encoded option code through the constrained helper. Mappings resolve code to label to regex. The example shows a subset of options."}, {"number": 27, "title": "Replacement names and literal text", "file": "27-replacement-names-and-literal-text.png", "notes": "The helper scans adjacent quote-aware chunks for with followed by a supported character name. It strips selected trailing punctuation and compares case-insensitively with the extracted replacement. Unquoted asterisk(s), hyphen(s) and underscore(s) convert. Quoted names keep their quote marks during checking and remain literal values. Production does not run re.sub."}, {"number": 28, "title": "The final parameter check", "file": "28-the-final-parameter-check.png", "notes": "The checker compares required and extracted keys in both directions, then validates values by declared type. Number accepts int or finite float but explicitly rejects bool. String requires str, boolean requires bool. This checks schema compliance, not whether a value semantically answers the request. It raises before FunctionCallResult is collected."}, {"number": 29, "title": "One result object per prompt", "file": "29-one-result-object-per-prompt.png", "notes": "After validation, the flow reorders parameter_dict according to definition order, constructs one FunctionCallResult and appends it outside the parameter loop. break ends the search through function definitions. The outer prompt loop continues with the same LLM instance and a fresh parameter dictionary."}, {"number": 30, "title": "Writing the output JSON", "file": "30-writing-the-output-json.png", "notes": "model_dump produces plain dictionaries. json.dumps serializes their list with ensure_ascii=False and allow_nan=False. It runs before directory creation and opening the file, so serialization failures do not truncate an existing output. Then the writer creates missing parents, writes the text once and closes the file via with. This is not an atomic-write guarantee for every I/O failure."}, {"number": 31, "title": "Error handling and run state", "file": "31-error-handling-and-run-state.png", "notes": "flow_state is updated before loading definitions, loading prompts, initializing the LLM, generating calls and writing results. The common exception handler formats the error type, stage and deepest traceback filename/function. Expected error types receive specific messages and unexpected errors include a traceback. A generation error stops the batch before write_results is called. A previous output may remain."}, {"number": 32, "title": "Testing expected and actual calls", "file": "32-testing-expected-and-actual-calls.png", "notes": "make test-21 and make test-42 generate saved outputs, then compare targets read the corresponding expected and actual arrays. The simplified checker catches each AssertionError and continues, displays missing and extra rows and reports equality accuracy. It compares regex text exactly. Python equality considers True==1, so production type checks remain necessary. A completed comparison with mismatches still exits normally."}, {"number": 33, "title": "One request, complete call", "file": "33-one-request-complete-call.png", "notes": "Replay the worked example. The function selector returns fn_add_numbers, numeric extraction offers 2.0 and 2.5, constrained argument generation selects each intended value with current-parameter context, parameter_type_checker validates the complete dictionary and write_results saves one record. Token IDs and scores in the walkthrough were illustrative; the code path was traced from the submitted source."}];
let current = 0;
const image = document.getElementById('slide');
const previous = document.getElementById('previous');
const next = document.getElementById('next');
const jump = document.getElementById('jump');
const notes = document.getElementById('notes');
for (const [index, slide] of slides.entries()) {
  const option = document.createElement('option');
  option.value = index;
  option.textContent = `${String(slide.number).padStart(2, '0')} · ${slide.title}`;
  jump.appendChild(option);
}
function show(index) {
  current = Math.max(0, Math.min(slides.length - 1, index));
  const slide = slides[current];
  image.src = 'png/' + slide.file;
  image.alt = `${slide.number}. ${slide.title}`;
  document.getElementById('counter').textContent = `${current + 1} / ${slides.length}`;
  document.getElementById('notesTitle').textContent = slide.title;
  document.getElementById('notesText').textContent = slide.notes;
  previous.disabled = current === 0;
  next.disabled = current === slides.length - 1;
  jump.value = current;
  if (slides[current + 1]) { const preload = new Image(); preload.src = 'png/' + slides[current + 1].file; }
}
function toggleNotes() {
  notes.hidden = !notes.hidden;
  document.getElementById('notesButton').setAttribute('aria-expanded', String(!notes.hidden));
}
async function toggleFullscreen() {
  if (document.fullscreenElement) { await document.exitFullscreen(); }
  else if (document.documentElement.requestFullscreen) { await document.documentElement.requestFullscreen(); }
}
previous.addEventListener('click', () => show(current - 1));
next.addEventListener('click', () => show(current + 1));
jump.addEventListener('change', () => show(Number(jump.value)));
document.getElementById('notesButton').addEventListener('click', toggleNotes);
document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
document.addEventListener('keydown', event => {
  if (event.target.tagName === 'SELECT') return;
  if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(current + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); show(current - 1); }
  else if (event.key === 'Home') show(0);
  else if (event.key === 'End') show(slides.length - 1);
  else if (event.key.toLowerCase() === 'n') toggleNotes();
  else if (event.key.toLowerCase() === 'f') toggleFullscreen();
});
show(0);
</script>
</body>
</html>
