[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling project for the 42 curriculum"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }


[tool.mypy]
exclude = ['(^|/)([.]venv|llm_sdk|tests)/']
mypy_path = ["llm_sdk"]

[[tool.mypy.overrides]]
module = ["llm_sdk.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "helpers: fast deterministic extraction and token tests",
    "io: input/output, schema, and CLI error-boundary tests",
    "llm: opt-in real model inference (slow, cached weights required)",
]
